<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Impulso — frases para seu dia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Lora:wght@700&family=PT+Serif:wght@700&family=Merriweather:wght@700&family=Playfair+Display:wght@700&family=Noto+Serif:wght@700&display=swap');

  :root{
    --bg:#15130f;
    --panel:#1d1a15;
    --line:#33302a;
    --ink:#f2ede2;
    --ink-dim:#a79f8f;
    --amber:#d8a14a;
    --amber-dim:#8a6a34;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:28px 20px 40px;
  }
  header{
    margin-bottom:22px;
  }
  header .eyebrow{
    font-size:13px;
    color:var(--amber);
    letter-spacing:.02em;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:28px;
    line-height:1.15;
    margin:6px 0 4px;
  }
  header p{
    color:var(--ink-dim);
    font-size:14px;
    margin:0;
    line-height:1.5;
  }

  .themes{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:none;
  }
  .themes::-webkit-scrollbar{display:none;}
  .theme-btn{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .theme-btn.active{
    border-color:var(--amber);
    color:var(--amber);
  }

  /* CARD PREVIEW */
  .stage{
    aspect-ratio:9/16;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--line);
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage-inner{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:48px 34px;
    position:relative;
    overflow:hidden;
  }
  .stage-inner img#bgImg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  .stage-inner .scrim{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55) 75%);
    display:none;
  }
  .stage-inner.has-photo .scrim{ display:block; }
  .stage-inner.has-photo img#bgImg{ display:block; }
  .stage-inner.has-photo .quote-mark,
  .stage-inner.has-photo .quote-text,
  .stage-inner.has-photo .quote-tag{ position:relative; z-index:2; }

  .section-label{
    font-size:12px;
    color:var(--ink-dim);
    margin:0 0 8px;
  }
  .source-toggle{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .toggle-btn{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:13px 14px;
    border-radius:8px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .toggle-btn.active{
    border-color:var(--amber);
    color:var(--amber);
  }
  .attribution{
    font-size:11px;
    color:var(--ink-dim);
    margin:-8px 0 16px;
    min-height:14px;
  }
  .attribution a{
    color:var(--ink-dim);
  }
  .loading-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--amber);
    margin-right:6px;
    animation:pulse 1s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }
  .quote-mark{
    font-family:'Fraunces',serif;
    font-size:52px;
    line-height:1;
    color:rgba(255,255,255,.35);
    margin-bottom:6px;
  }
  .quote-text{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:30px;
    line-height:1.28;
    color:#fff;
  }
  .quote-tag{
    position:absolute;
    bottom:28px;
    left:34px;
    right:34px;
    font-size:12px;
    letter-spacing:.03em;
    color:rgba(255,255,255,.55);
    display:flex;
    justify-content:space-between;
  }

  /* palettes */
  .bg-dusk{ background: linear-gradient(160deg,#26140f,#0f1512 70%); }
  .bg-clay{ background: linear-gradient(160deg,#4a2c1a,#241209 75%); }
  .bg-moss{ background: linear-gradient(160deg,#1c2a1c,#0d130d 75%); }
  .bg-ink{  background: linear-gradient(160deg,#1a1a24,#08080c 75%); }

  .controls{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  button.primary{
    flex:1;
    background:var(--amber);
    color:#15130f;
    border:none;
    padding:13px 16px;
    border-radius:10px;
    font-weight:600;
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  button.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
    padding:13px 16px;
    border-radius:10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  button:active{ transform: scale(.98); }

  .palette-row{
    display:flex;
    gap:8px;
    margin-bottom:24px;
  }
  .swatch{
    flex:1;
    height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    cursor:pointer;
    opacity:.55;
  }
  .swatch.active{ opacity:1; outline:2px solid var(--amber); outline-offset:2px; }

  footer{
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
  }

  #dl-canvas{ display:none; }

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      /* keep dark aesthetic intentionally — motivational card reads best dark */
    }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="eyebrow">Impulso</div>
    <h1>Uma frase para hoje</h1>
    <p>Escolha um tema, gere sua frase e baixe pronta para o story.</p>
  </header>

  <div class="themes" id="themes"></div>

  <div class="stage">
    <div class="stage-inner bg-dusk" id="stageInner">
      <img id="bgImg" alt="" />
      <div class="scrim"></div>
      <div class="quote-mark">“</div>
      <div class="quote-text" id="quoteText">O esforço de hoje é a força de amanhã.</div>
      <div class="quote-tag"><span id="tagLeft">FOCO</span></div>
    </div>
  </div>

  <div class="controls" style="margin-bottom:10px;">
    <button class="primary" id="btnGerarFrase">Gerar frase</button>
  </div>

  <div class="section-label">Tipo de letra</div>
  <div class="themes" id="fontThemes"></div>

  <div class="section-label">Fundo da imagem</div>
  <div class="source-toggle">
    <button class="toggle-btn active" id="srcGerado">Gerar Imagem</button>
  </div>

  <div class="themes" id="bgThemes"></div>

  <div class="attribution" id="attribution"></div>

  <div class="palette-row" id="palette"></div>

  <div class="controls">
    <button class="secondary" id="btnShare">Compartilhar imagem</button>
    <button class="primary" id="btnSave">Baixar imagem</button>
  </div>

  <footer>Toque em "Gerar frase" quantas vezes quiser.</footer>
</div>

<canvas id="dl-canvas" width="1080" height="1920"></canvas>

function applyGeneratedBg(){

}

async function fetchUnsplashBg(catKey){
  const cat = BG_CATEGORIES[catKey];
  const attributionEl = document.getElementById('attribution');

  // fallback imediato: gradiente, enquanto a foto carrega
  stageInner.classList.remove('has-photo');
  const [c1,c2] = cat.grad;
  stageInner.style.background = `linear-gradient(160deg, ${c1}, ${c2} 75%)`;
  attributionEl.innerHTML = '<span class="loading-dot"></span>Buscando foto...';

  if(unsplashCache[catKey]){
    applyUnsplashResult(catKey);
    return;
  }

  try{
    const res = await fetch(`https://api.unsplash.com/photos/random?query=${encodeURIComponent(cat.query)}&orientation=portrait`, {
      headers: { 'Authorization': `Client-ID ${UNSPLASH_ACCESS_KEY}` }
    });
    if(!res.ok){
      const errBody = await res.text();
      throw new Error(`HTTP ${res.status}: ${errBody}`);
    }
    const data = await res.json();
    unsplashCache[catKey] = {
      url: data.urls.regular,
      downloadUrl: data.urls.full,
      photographerName: data.user.name,
      photographerLink: data.user.links.html
    };
    if(currentBgCategory === catKey && bgMode === 'gerado'){
      applyUnsplashResult(catKey);
    }
  }catch(err){
    console.error('Unsplash fetch error:', err);
    attributionEl.textContent = 'Erro ao buscar foto: ' + err.message;
  }
}

function applyUnsplashResult(catKey){
  const data = unsplashCache[catKey];
  const attributionEl = document.getElementById('attribution');
  stageInner.classList.add('has-photo');
  bgImg.src = data.url;
  stageInner.style.background = 'transparent';
  attributionEl.textContent = 'Foto buscada';
}

      sw.classList.add('active');

      stageInner.classList.add(cls);
    };

}

function newQuote(){
  const theme = THEMES[currentTheme];
  if(!usedIndexes[currentTheme]) usedIndexes[currentTheme] = new Set();
  let pool = theme.quotes.map((_,i)=>i).filter(i=>!usedIndexes[currentTheme].has(i));
  if(pool.length===0){ usedIndexes[currentTheme].clear(); pool = theme.quotes.map((_,i)=>i); }
  const idx = pool[Math.floor(Math.random()*pool.length)];
  usedIndexes[currentTheme].add(idx);
  quoteText.textContent = theme.quotes[idx];
  tagLeft.textContent = theme.tag;
}

function drawBackground(ctx, W, H, onDone){
  const isPhoto = (bgMode === 'gerado' && unsplashCache[currentBgCategory] ? unsplashCache[currentBgCategory].url : null);

  if(isPhoto){
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      const ratio = Math.max(W/img.width, H/img.height);
      const w = img.width*ratio, h = img.height*ratio;
      ctx.drawImage(img, (W-w)/2, (H-h)/2, w, h);
      const scrim = ctx.createLinearGradient(0,0,0,H);
      scrim.addColorStop(0,'rgba(0,0,0,.15)');
      scrim.addColorStop(0.75,'rgba(0,0,0,.55)');
      ctx.fillStyle = scrim;
      ctx.fillRect(0,0,W,H);
      onDone();
    };
    img.onerror = ()=>{ drawGradientFallback(ctx,W,H); onDone(); };
    img.src = isPhoto;
    return;
  }
  drawGradientFallback(ctx,W,H);
  onDone();
}

function drawGradientFallback(ctx,W,H){
  const gradients = bgMode === 'gerado'
    ? BG_CATEGORIES[currentBgCategory].grad
    : { 'bg-dusk': ['#26140f','#0f1512'], 'bg-clay': ['#4a2c1a','#241209'], 'bg-moss': ['#1c2a1c','#0d130d'], 'bg-ink': ['#1a1a24','#08080c'] }[currentPalette];
  const [c1,c2] = gradients;
  const grad = ctx.createLinearGradient(0,0,W*0.3,H);
  grad.addColorStop(0,c1);
  grad.addColorStop(0.75,c2);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function renderCanvas(cb){
  const canvas = document.getElementById('dl-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  drawBackground(ctx, W, H, ()=>drawText(ctx, W, H, ()=>cb(canvas)));
}

function drawText(ctx, W, H, onDone){
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '600 140px Fraunces, serif';
  ctx.fillText('"', 68, 300);

  ctx.fillStyle = '#ffffff';
  ctx.font = `700 74px ${currentFont}, serif`;
  const text = quoteText.textContent;
  const maxWidth = W - 140;
  const words = text.split(' ');
  let line = '';
  let lines = [];
  words.forEach(word=>{
    const test = line + word + ' ';
    if(ctx.measureText(test).width > maxWidth && line !== ''){
      lines.push(line);
      line = word + ' ';
    } else {
      line = test;
    }
  });
  lines.push(line);

  let y = H/2 - (lines.length-1)*46;
  lines.forEach(l=>{
    ctx.fillText(l.trim(), 70, y);
    y += 92;
  });

  ctx.font = '500 30px Inter, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(tagLeft.textContent, 70, H-90);
  const impulsoWidth = ctx.measureText('Impulso').width;
  ctx.fillText('Impulso', W-70-impulsoWidth, H-90);

  onDone();
}

function renderPNG(cb){
  renderCanvas((canvas)=>cb(canvas.toDataURL('image/png')));
}

function nativePlugin(name){
  return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[name];
}

function drawAndDownload(){
  renderPNG(async (dataUrl)=>{
    const Media = nativePlugin('Media');
    if(Media){
      try{
        await Media.savePhoto({ path: dataUrl });
        alert('Imagem salva na galeria.');
      }catch(e){
        console.error(e);
        alert('Não foi possível salvar a imagem.');
      }
      return;
    }
    const link = document.createElement('a');
    link.download = 'frase-impulso.png';
    link.href = dataUrl;
    link.click();
  });
}

function drawAndShare(){
  renderPNG(async (dataUrl)=>{
    const Share = nativePlugin('Share');
    const Filesystem = nativePlugin('Filesystem');
    if(Share && Filesystem){
      try{
        const base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
        const saved = await Filesystem.writeFile({
          path: 'impulso-imagem.png',
          data: base64,
          directory: 'CACHE'
        });
        await Share.share({
          title: 'Impulso',
          text: quoteText.textContent,
          dialogTitle: 'Compartilhar imagem',
          files: [saved.uri]
        });
      }catch(e){
        if(e && (e.aborted || e.code === 'SHARE_CANCELLED')) return;
        console.error(e);
        alert('Não foi possível compartilhar a imagem.');
      }
      return;
    }
    const blob = await new Promise(resolve=>canvasToBlob(dataUrl, resolve));
    if(!blob) return;
    const file = new File([blob], 'frase-impulso.png', {type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Impulso', text: quoteText.textContent});
      }catch(e){
        if(e.name !== 'AbortError') alert('Não foi possível compartilhar.');
      }
    }else{
      const link = document.createElement('a');
      link.download = 'frase-impulso.png';
      link.href = dataUrl;
      link.click();
    }
  });
}

function canvasToBlob(dataUrl, cb){
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    c.toBlob(cb, 'image/png');
  };
  img.onerror = ()=>cb(null);
  img.src = dataUrl;
}

document.getElementById('srcGerado').onclick = (e)=>{
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  delete unsplashCache[currentBgCategory];
  fetchUnsplashBg(currentBgCategory);
};

buildThemeButtons();
buildBgThemes();
buildFontButtons();
buildPalette();
applyFont();
applyGeneratedBg();
newQuote();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
