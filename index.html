<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Impulso â€” frases para seu dia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Lora:wght@700&family=PT+Serif:wght@700&family=Merriweather:wght@700&family=Playfair+Display:wght@700&family=Noto+Serif:wght@700&display=swap');

  :root{
    --bg:#15130f;
    --panel:#1d1a15;
    --line:#33302a;
    --ink:#f2ede2;
    --ink-dim:#a79f8f;
    --amber:#d8a14a;
    --amber-dim:#8a6a34;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100%;
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:28px 20px 40px;
  }
  .app-header .eyebrow{
    font-size:13px;
    color:var(--amber);
    letter-spacing:.02em;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:28px;
    line-height:1.15;
    margin:6px 0 4px;
  }
  header p{
    color:var(--ink-dim);
    font-size:14px;
    margin:0;
    line-height:1.5;
  }

  .themes{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:none;
  }
  .themes::-webkit-scrollbar{display:none;}
  .theme-btn{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .theme-btn.active{
    border-color:var(--amber);
    color:var(--amber);
  }

  /* CARD PREVIEW */
  .stage{
    aspect-ratio:9/16;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--line);
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage-inner{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:48px 34px;
    position:relative;
    overflow:hidden;
  }
  .stage-inner img#bgImg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  .stage-inner .scrim{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55) 75%);
    display:none;
  }
  .stage-inner.has-photo .scrim{ display:block; }
  .stage-inner.has-photo img#bgImg{ display:block; }
  .stage-inner.has-photo .quote-mark,
  .stage-inner.has-photo .quote-text,
  .stage-inner.has-photo .quote-tag{ position:relative; z-index:2; }

  .section-label{
    font-size:12px;
    color:var(--ink-dim);
    margin:0 0 8px;
  }
  .source-toggle{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .toggle-btn{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:13px 14px;
    border-radius:8px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .toggle-btn.active{
    border-color:var(--amber);
    color:var(--amber);
  }
  .attribution{
    font-size:11px;
    color:var(--ink-dim);
    margin:-8px 0 16px;
    min-height:14px;
  }
  .attribution a{
    color:var(--ink-dim);
  }
  .loading-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--amber);
    margin-right:6px;
    animation:pulse 1s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }
  .quote-mark{
    font-family:'Fraunces',serif;
    font-size:52px;
    line-height:1;
    color:rgba(255,255,255,.35);
    margin-bottom:6px;
  }
  .quote-text{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:30px;
    line-height:1.28;
    color:#fff;
  }
  .quote-tag{
    position:absolute;
    bottom:28px;
    left:34px;
    right:34px;
    font-size:12px;
    letter-spacing:.03em;
    color:rgba(255,255,255,.55);
    display:flex;
    justify-content:space-between;
  }

  /* palettes */
  .bg-dusk{ background: linear-gradient(160deg,#26140f,#0f1512 70%); }
  .bg-clay{ background: linear-gradient(160deg,#4a2c1a,#241209 75%); }
  .bg-moss{ background: linear-gradient(160deg,#1c2a1c,#0d130d 75%); }
  .bg-ink{  background: linear-gradient(160deg,#1a1a24,#08080c 75%); }

  .controls{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  button.primary{
    flex:1;
    background:var(--amber);
    color:#15130f;
    border:none;
    padding:13px 16px;
    border-radius:10px;
    font-weight:600;
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  button.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
    padding:13px 16px;
    border-radius:10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  button:active{ transform: scale(.98); }

  .palette-row{
    display:flex;
    gap:8px;
    margin-bottom:24px;
  }
  .swatch{
    flex:1;
    height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    cursor:pointer;
    opacity:.55;
  }
  .swatch.active{ opacity:1; outline:2px solid var(--amber); outline-offset:2px; }

  footer{
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
  }

  #updateBanner{
    position:fixed;
    left:0;
    right:0;
    bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));
    z-index:50;
    display:none;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    background:rgba(216,161,74,.96);
    color:#15130f;
    font-size:13px;
    font-weight:600;
    box-shadow:0 -4px 16px rgba(0,0,0,.35);
  }
  #updateBanner.show{ display:flex; }
  #updateBanner .upd-msg{ flex:1; line-height:1.35; }
  #updateBanner .upd-btn{
    background:#15130f;
    color:var(--amber);
    border:none;
    padding:9px 14px;
    border-radius:8px;
    font-weight:700;
    font-size:13px;
    font-family:'Inter',sans-serif;
  }
  #updateBanner .upd-close{
    background:transparent;
    border:none;
    color:#15130f;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    padding:2px 4px;
  }

  /* ============ SHELL: header fixo + abas inferiores ============ */
  :root{
    --header-h:66px;
    --tabbar-h:60px;
  }
  .app-header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:40;
    background:rgba(21,19,15,.93);
    backdrop-filter:saturate(140%) blur(12px);
    -webkit-backdrop-filter:saturate(140%) blur(12px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top,0px);
  }
  .app-header .hdr{
    max-width:460px;
    margin:0 auto;
    padding:11px 20px 12px;
  }
  .app-header .eyebrow{
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
  }
  .app-header h1{
    font-size:21px;
    margin:2px 0 0;
  }
  .app-header p{ display:none; }
  @media (min-height:730px){
    .app-header h1{ font-size:24px; }
    .app-header p{ display:block; font-size:13px; margin-top:3px; }
  }

  main.wrap{
    padding-top:calc(var(--header-h) + 26px);
    padding-bottom:calc(var(--tabbar-h) + 40px);
  }
  @media (min-height:730px){
    main.wrap{ padding-top:calc(var(--header-h) + 52px); }
  }

  .tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:45;
    display:flex;
    background:rgba(21,19,15,.95);
    backdrop-filter:saturate(140%) blur(12px);
    -webkit-backdrop-filter:saturate(140%) blur(12px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tab-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink-dim);
    padding:7px 2px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:color .15s;
  }
  .tab-btn svg{ width:21px; height:21px; display:block; }
  .tab-btn.active{ color:var(--amber); }
  .tab[hidden]{ display:none; }

  /* ============ LIVROS ============ */
  .tab-intro{
    color:var(--ink-dim);
    font-size:13.5px;
    line-height:1.5;
    margin:0 0 14px;
  }
  .books-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .book-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    padding:0;
    text-align:left;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .book-card:active{ transform:scale(.985); }
  /* A capa e um quadro fixo 2:3 com overflow hidden. A <img> e posicionada
     em vez de usar height:100%: assim ela preenche a area exata do quadro
     sem depender de altura percentual (que falha dentro de <button> e de
     flex no WebView do Android e deixa uma faixa vazia embaixo). */
  .book-cover{
    display:block;
    position:relative;
    width:100%;
    aspect-ratio:2/3;
    overflow:hidden;
    background:var(--panel);
  }
  .book-cover svg{ display:block; width:100%; height:100%; }
  .book-cover img.cover-img{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    background:var(--panel);
  }
  .book-info{ padding:9px 10px 11px; display:block; }
  .book-card .book-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:14px;
    line-height:1.25;
    color:var(--ink);
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .book-card .book-author{
    display:block;
    font-size:11.5px;
    color:var(--ink-dim);
    margin-top:3px;
  }
  .book-card .book-tag{
    display:inline-block;
    margin-top:7px;
    padding:2px 8px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:9.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .empty-note{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:18px 16px;
    color:var(--ink-dim);
    font-size:13px;
    line-height:1.55;
    text-align:center;
  }

  /* ============ SHEET / MODAL ============ */
  .backdrop{
    position:fixed;
    inset:0;
    z-index:60;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.72);
  }
  .backdrop[hidden]{ display:none; }
  .sheet{
    width:100%;
    max-width:460px;
    max-height:88vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:18px 18px 0 0;
    padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));
    animation:sheetUp .22s ease;
  }
  @keyframes sheetUp{ from{ transform:translateY(22px); opacity:.35; } to{ transform:none; opacity:1; } }
  .sheet-grip{
    width:38px; height:4px; border-radius:2px;
    background:var(--line);
    margin:0 auto 14px;
  }
  .sheet-head{ display:flex; gap:14px; align-items:flex-start; }
  .sheet-cover{
    position:relative;
    width:104px; flex:0 0 104px;
    aspect-ratio:2/3;
    align-self:flex-start;
    border-radius:8px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    background:var(--panel);
  }
  .sheet-cover svg{ display:block; width:100%; height:100%; }
  /* mesmo tratamento do card: <img> absoluta preenchendo o quadro, para a
     miniatura nao sobrar faixa vazia na parte inferior. */
  .sheet-cover img.cover-img{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    background:var(--panel);
  }
  .sheet h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:20px;
    line-height:1.2;
    margin:0 0 5px;
  }
  .sheet .byline{ color:var(--ink-dim); font-size:13px; }
  .theme-tag{
    display:inline-block;
    margin-top:9px;
    border:1px solid var(--amber-dim);
    color:var(--amber);
    border-radius:999px;
    padding:3px 10px;
    font-size:11px;
    letter-spacing:.04em;
  }
  .synopsis{
    color:var(--ink);
    font-size:14px;
    line-height:1.6;
    margin:16px 0 12px;
  }
  .facts{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .fact{
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 11px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .fact b{ color:var(--ink); font-weight:600; }
  .sheet .controls{ margin-bottom:0; }
  .media-hint{
    margin-top:12px;
    font-size:11.5px;
    line-height:1.5;
    color:var(--ink-dim);
    text-align:center;
  }

  /* ============ LEITOR DE PDF ============ */
  .reader{
    position:fixed;
    inset:0;
    z-index:80;
    background:#0b0a08;
    display:flex;
    flex-direction:column;
  }
  .reader[hidden]{ display:none; }
  .reader-bar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .reader-bar .r-title{
    flex:1;
    min-width:0;
    font-size:12.5px;
    color:var(--ink-dim);
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .reader-bar .r-ext{ font-size:17px; }
  .icon-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    width:34px; height:34px;
    border-radius:9px;
    font-size:15px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .icon-btn:disabled{ opacity:.35; cursor:default; }
  .reader-pages{
    flex:1;
    min-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  /* o iframe do Google Drive ocupa a tela toda menos a barra do leitor */
  .reader-frame{
    display:block;
    flex:1;
    width:100%;
    height:100%;
    min-height:80vh;
    border:0;
    background:#fff;
  }
  .reader-msg{
    margin:auto;
    color:var(--ink-dim);
    font-size:13px;
    text-align:center;
    line-height:1.6;
    padding:0 28px;
  }

  /* ============ PLAYER DE ÃUDIO ============ */
  .player{
    position:fixed;
    left:0; right:0;
    bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));
    z-index:50;
    max-width:460px;
    margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:14px 14px 0 0;
    padding:11px 14px 13px;
    box-shadow:0 -8px 26px rgba(0,0,0,.5);
  }
  .player[hidden]{ display:none; }
  .player-top{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .p-thumb{
    width:34px; height:51px; flex:0 0 34px;
    border-radius:4px; overflow:hidden;
    background:#000;
  }
  .p-thumb svg{ display:block; width:100%; height:100%; }
  .p-meta{ flex:1; min-width:0; }
  .p-title{
    font-size:12.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .p-sub{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }
  .p-btns{ display:flex; align-items:center; gap:8px; }
  .p-play{
    width:40px; height:40px; flex:0 0 40px;
    border-radius:50%;
    border:none;
    background:var(--amber);
    color:#15130f;
    font-size:15px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .p-speed{
    background:transparent;
    border:1px solid var(--line);
    color:var(--amber);
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    min-width:44px;
  }
  .p-times{
    display:flex;
    justify-content:space-between;
    font-size:10.5px;
    color:var(--ink-dim);
    margin-top:5px;
  }
  input[type=range].rng{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    background:transparent;
    display:block;
    margin:0;
  }
  input[type=range].rng::-webkit-slider-runnable-track{
    height:4px; border-radius:2px; background:var(--line);
  }
  input[type=range].rng::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px; margin-top:-5px;
    border-radius:50%; background:var(--amber);
  }
  input[type=range].rng::-moz-range-track{ height:4px; border-radius:2px; background:var(--line); }
  input[type=range].rng::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:var(--amber); }

  /* ============ HÃBITOS ============ */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:17px;
    margin:0 0 3px;
  }
  .panel .sub{ color:var(--ink-dim); font-size:12.5px; margin:0 0 14px; line-height:1.5; }
  .streak-row{ display:flex; align-items:center; gap:16px; }
  .streak-num{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:44px;
    line-height:1;
    color:var(--amber);
  }
  .streak-cap{ font-size:12px; color:var(--ink-dim); line-height:1.5; }
  .bar{
    height:7px;
    border-radius:4px;
    background:var(--line);
    overflow:hidden;
    margin-top:14px;
  }
  .bar > i{
    display:block;
    height:100%;
    background:var(--amber);
    border-radius:4px;
    transition:width .3s ease;
  }
  .habit-list{ display:flex; flex-direction:column; gap:9px; }
  .habit-row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    background:transparent;
    border:1px solid var(--line);
    border-radius:11px;
    padding:12px 14px;
    cursor:pointer;
    text-align:left;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    font-size:14px;
  }
  .habit-row.done{ border-color:var(--amber-dim); background:rgba(216,161,74,.08); }
  .tick{
    width:22px; height:22px; flex:0 0 22px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    color:transparent;
  }
  .habit-row.done .tick{
    background:var(--amber);
    border-color:var(--amber);
    color:#15130f;
  }
  .habit-row .h-label{ flex:1; }
  .habit-row .h-key{ font-size:11px; color:var(--ink-dim); }
  .heat{ display:flex; gap:5px; margin-top:14px; }
  .heat i{
    flex:1;
    height:26px;
    border-radius:4px;
    background:#241f1a;
    border:1px solid transparent;
  }
  .heat i.on{ background:var(--amber); opacity:.9; }

async function fetchUnsplashBg(catKey){
  const cat = BG_CATEGORIES[catKey];
  const attributionEl = document.getElementById('attribution');

  // fallback imediato: gradiente, enquanto a foto carrega
  stageInner.classList.remove('has-photo');
  const [c1,c2] = cat.grad;
  stageInner.style.background = `linear-gradient(160deg, ${c1}, ${c2} 75%)`;
  attributionEl.innerHTML = '<span class="loading-dot"></span>Buscando foto...';

  if(unsplashCache[catKey]){
    applyUnsplashResult(catKey);
    return;
  }

  try{
    const res = await fetch(`https://api.unsplash.com/photos/random?query=${encodeURIComponent(cat.query)}&orientation=portrait`, {
      headers: { 'Authorization': `Client-ID ${UNSPLASH_ACCESS_KEY}` }
    });
    if(!res.ok){
      const errBody = await res.text();
      throw new Error(`HTTP ${res.status}: ${errBody}`);
    }
    const data = await res.json();
    unsplashCache[catKey] = {
      url: data.urls.regular,
      downloadUrl: data.urls.full,
      photographerName: data.user.name,
      photographerLink: data.user.links.html
    };
    if(currentBgCategory === catKey && bgMode === 'gerado'){
      applyUnsplashResult(catKey);
    }
  }catch(err){
    console.error('Unsplash fetch error:', err);
    attributionEl.textContent = 'Erro ao buscar foto: ' + err.message;
  }
}

function applyUnsplashResult(catKey){
  const data = unsplashCache[catKey];
  const attributionEl = document.getElementById('attribution');
  stageInner.classList.add('has-photo');
  bgImg.src = data.url;
  stageInner.style.background = 'transparent';
  attributionEl.textContent = 'Foto buscada';
}

function newQuote(){
  const theme = THEMES[currentTheme];
  if(!usedIndexes[currentTheme]) usedIndexes[currentTheme] = new Set();
  let pool = theme.quotes.map((_,i)=>i).filter(i=>!usedIndexes[currentTheme].has(i));
  if(pool.length===0){ usedIndexes[currentTheme].clear(); pool = theme.quotes.map((_,i)=>i); }
  const idx = pool[Math.floor(Math.random()*pool.length)];
  usedIndexes[currentTheme].add(idx);
  quoteText.textContent = theme.quotes[idx];
  tagLeft.textContent = theme.label.toUpperCase();
  usageBump('frases', currentTheme);
}

function drawBackground(ctx, W, H, onDone){
  const isPhoto = (bgMode === 'gerado' && unsplashCache[currentBgCategory] ? unsplashCache[currentBgCategory].url : null);

  if(isPhoto){
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      const ratio = Math.max(W/img.width, H/img.height);
      const w = img.width*ratio, h = img.height*ratio;
      ctx.drawImage(img, (W-w)/2, (H-h)/2, w, h);
      const scrim = ctx.createLinearGradient(0,0,0,H);
      scrim.addColorStop(0,'rgba(0,0,0,.15)');
      scrim.addColorStop(0.75,'rgba(0,0,0,.55)');
      ctx.fillStyle = scrim;
      ctx.fillRect(0,0,W,H);
      onDone();
    };
    img.onerror = ()=>{ drawGradientFallback(ctx,W,H); onDone(); };
    img.src = isPhoto;
    return;
  }
  drawGradientFallback(ctx,W,H);
  onDone();
}

function drawGradientFallback(ctx,W,H){
  const gradients = bgMode === 'gerado'
    ? BG_CATEGORIES[currentBgCategory].grad
    : { 'bg-dusk': ['#26140f','#0f1512'], 'bg-clay': ['#4a2c1a','#241209'], 'bg-moss': ['#1c2a1c','#0d130d'], 'bg-ink': ['#1a1a24','#08080c'] }[currentPalette];
  const [c1,c2] = gradients;
  const grad = ctx.createLinearGradient(0,0,W*0.3,H);
  grad.addColorStop(0,c1);
  grad.addColorStop(0.75,c2);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function renderCanvas(cb){
  const canvas = document.getElementById('dl-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  drawBackground(ctx, W, H, ()=>drawText(ctx, W, H, ()=>cb(canvas)));
}

function drawText(ctx, W, H, onDone){
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '600 140px Fraunces, serif';
  ctx.fillText('"', 68, 300);

  ctx.fillStyle = '#ffffff';
  ctx.font = `700 74px ${currentFont}, serif`;
  const text = quoteText.textContent;
  const maxWidth = W - 140;
  const words = text.split(' ');
  let line = '';
  let lines = [];
  words.forEach(word=>{
    const test = line + word + ' ';
    if(ctx.measureText(test).width > maxWidth && line !== ''){
      lines.push(line);
      line = word + ' ';
    } else {
      line = test;
    }
  });
  lines.push(line);

  let y = H/2 - (lines.length-1)*46;
  lines.forEach(l=>{
    ctx.fillText(l.trim(), 70, y);
    y += 92;
  });

  ctx.font = '500 30px Inter, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(tagLeft.textContent, 70, H-90);
  const impulsoWidth = ctx.measureText('Impulso').width;
  ctx.fillText('Impulso', W-70-impulsoWidth, H-90);

  onDone();
}

function renderPNG(cb){
  renderCanvas((canvas)=>cb(canvas.toDataURL('image/png')));
}

function nativePlugin(name){
  return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[name];
}

async function drawAndDownload(){
  renderPNG(async (dataUrl)=>{
    const Media = nativePlugin('Media');
    if(Media){
      try{

        try{
          const basePath = (await Media.getAlbumsPath()).path;
          if(basePath){
            const byName = (await Media.getAlbums()).albums.find(a=>a.name === 'Impulso' && a.identifier.indexOf(basePath) === 0);
            if(byName) albumIdentifier = byName.identifier;
          }
        }catch(e){ console.error('[save] lookup album:', e); }
        if(!albumIdentifier){
          try{ await Media.createAlbum({ name: 'Impulso' }); }catch(e){}
          try{
            const basePath = (await Media.getAlbumsPath()).path;
            if(basePath){
              const byName = (await Media.getAlbums()).albums.find(a=>a.name === 'Impulso' && a.identifier.indexOf(basePath) === 0);
              if(byName) albumIdentifier = byName.identifier;
            }
          }catch(e){ console.error('[save] album apos create:', e); }
        }
        if(!albumIdentifier) throw new Error('Nao foi possivel resolver um album no Android');
        await Media.savePhoto({

        });

    link.href = dataUrl;
    link.click();
  });
}

        });
      }catch(e){

        alert('NÃ£o foi possÃ­vel compartilhar a imagem.');
      }
      return;
    }

      try{
        await navigator.share({files:[file], title:'Impulso', text: quoteText.textContent});
      }catch(e){
        if(e.name !== 'AbortError') alert('NÃ£o foi possÃ­vel compartilhar.');

    }else{

      link.download = 'frase-impulso.png';
      link.href = dataUrl;
      link.click();
    }
  });

function canvasToBlob(dataUrl, cb){
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    c.toBlob(cb, 'image/png');
  };
  img.onerror = ()=>cb(null);
  img.src = dataUrl;
}

const store = {
  get(key, fallback){
    try{
      const raw = localStorage.getItem('impulso_' + key);
      return raw === null ? fallback : JSON.parse(raw);
    }catch(e){ return fallback; }
  },
  set(key, value){
    try{ localStorage.setItem('impulso_' + key, JSON.stringify(value)); }
    catch(e){ console.warn('[store] falha ao gravar', key, e); }
  }
};

let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 3000);
}

/* ==================================================================
   USO POR TEMA â€” alimenta a notificaÃ§Ã£o diÃ¡ria e recomendaÃ§Ãµes futuras
   ================================================================== */
function usageData(){
  const u = store.get('usage_v1', null);
  if(u && u.frases && u.livros) return u;
  return { frases:{}, livros:{} };
}
function usageBump(kind, theme){
  if(!theme) return;
  const u = usageData();
  u[kind][theme] = (u[kind][theme] || 0) + 1;
  store.set('usage_v1', u);
}
function usageTop(kind){
  const map = usageData()[kind] || {};
  let best = null, bestCount = 0;
  Object.keys(map).forEach(k=>{
    if(map[k] > bestCount){ bestCount = map[k]; best = k; }
  });
  return best;
}
function themeLabel(key){
  return (THEMES[key] && THEMES[key].label) || 'Foco';
}

  dinheiro:'dinheiro', recomeco:'recomeco', saúde:'academia', saude:'academia'

function temaDoLivro(livro){
  return CATEGORIA_TEMA[String(livro && livro.categoria || '').toLowerCase()] || 'foco';
}

// O Drive gera a miniatura da primeira pagina de um PDF publico sozinho.
// O id ja esta no pdfUrl, entao nao ha nada novo para cadastrar no acervo.
function extrairIdDrive(pdfUrl){
  const match = /\/d\/([^/?#]+)/.exec(pdfUrl || '');
  return match ? match[1] : null;
}

function capaUrl(livro){
  const id = extrairIdDrive(livro && livro.pdfUrl);
  return id ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w400' : null;
}

// Fallback quando o Drive nao devolve miniatura (PDF sem pagina renderizavel,
// link sem permissao, etc). Troca a <img> pelo desenho procedural.
function capaFallback(img){
  img.onerror = null;
  const livro = findBook(img.getAttribute('data-book'));
  if(livro) img.outerHTML = coverSvg(livro, 'fb');
}

function coverImg(livro, scope){
  const src = capaUrl(livro);
  if(!src) return coverSvg(livro, scope);
  return '<img class="cover-img" src="' + esc(src) + '" alt="' + esc(livro.titulo) + '"'
    + ' data-book="' + esc(livro.id) + '" onerror="capaFallback(this)">';
}

// o autor e a tag ja aparecem no bloco de texto do card. Desenhar aqui

function coverSvg(book, scope){
  const colors = BOOK_COLORS[temaDoLivro(book)] || ['#d8a14a','#2a1c08'];
  const gid = 'cg' + book.id + scope;

  return '<svg viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + esc(book.titulo) + '">'
    + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2=".4" y2="1">'
    + '<stop offset="0" stop-color="' + colors[0] + '"/>'
    + '<stop offset="1" stop-color="' + colors[1] + '"/></linearGradient></defs>'
    + '<rect width="300" height="450" fill="url(#' + gid + ')"/>'
    + '<g fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="1.3">'

function renderLivros(){

  html += '<div class="themes" id="bookFilters">';

    html += '<button class="theme-btn' + (key === bookFilter ? ' active' : '') + '" data-theme="' + key + '">' + esc(label) + '</button>';

    list.forEach(b=>{

      html += '<button class="book-card" data-book="' + b.id + '">'

// WebView, o leitor ainda entrega o PDF no navegador do sistema.
let readerOpen = null;

function abrirLivroExterno(url){
  if(!url) return;
  const Browser = nativePlugin('Browser');
  if(Browser && Browser.open){
    Browser.open({ url: url }).catch(e=>{
      console.error('[reader] Browser.open falhou:', e);

}

   PLAYER DE ÃUDIO
   ================================================================== */
const SPEEDS = [1, 1.5, 2];
const audio = $('audioEl');
const playerState = { book:null, rate:1, lastSave:0 };

function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function setPlayIcon(playing){
  $('pPlay').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
}

function openPlayer(book){
  playerState.book = book;
  playerState.rate = SPEEDS.indexOf(store.get('audio_rate', 1)) > -1 ? store.get('audio_rate', 1) : 1;

  $('pTitle').textContent = book.titulo;
  $('pSub').textContent = book.autor;
  $('pThumb').innerHTML = coverSvg(book, 'p');
  $('pSpeed').textContent = playerState.rate + 'x';
  $('pSeek').value = 0;
  $('pCur').textContent = '0:00';
  $('player').hidden = false;

  if(!book.audioUrl){
    // limpa qualquer audio anterior para nao tocar a trilha do livro errado
    audio.pause();
    audio.removeAttribute('src');
    try{ audio.load(); }catch(e){}
    $('pDur').textContent = '--:--';
    $('pSeek').value = 0;
    $('pCur').textContent = '0:00';
    setPlayIcon(false);
    toast('Ãudio ainda nÃ£o disponÃ­vel para este livro.');
    return;
  }

  $('pDur').textContent = fmtTime(book.minutes * 60);
  audio.src = book.audioUrl;
  audio.playbackRate = playerState.rate;

  const savedPos = store.get('audio_pos_' + book.id, 0);
  const onMeta = ()=>{
    if(savedPos > 5 && savedPos < audio.duration - 10) audio.currentTime = savedPos;
    $('pDur').textContent = fmtTime(audio.duration);
    paintSeek();
  };
  audio.addEventListener('loadedmetadata', onMeta, { once:true });

  const p = audio.play();
  if(p && p.then) p.then(()=>setPlayIcon(true)).catch(()=>setPlayIcon(false));
  else setPlayIcon(true);
}

function paintSeek(){
  if(!audio.duration || !isFinite(audio.duration)) return;
  $('pSeek').value = Math.round((audio.currentTime / audio.duration) * 1000);
  $('pCur').textContent = fmtTime(audio.currentTime);
}

function saveAudioPos(){
  if(!playerState.book || !playerState.book.audioUrl) return;
  if(!isFinite(audio.currentTime)) return;
  store.set('audio_pos_' + playerState.book.id, Math.floor(audio.currentTime));
}

function closePlayer(){
  saveAudioPos();
  audio.pause();
  audio.removeAttribute('src');
  try{ audio.load(); }catch(e){}
  playerState.book = null;
  $('player').hidden = true;
}

const HABIT_PRESETS = [
  { id:'treinar',   label:'Treinar' },
  { id:'caminhar',  label:'Caminhar 30 min' },
  { id:'ler',       label:'Ler 20 min' },
  { id:'estudar',   label:'Estudar' },
  { id:'agua',      label:'Beber Ã¡gua' },
  { id:'meditar',   label:'Meditar' },
  { id:'acordar',   label:'Acordar no horÃ¡rio' },
  { id:'dormir',    label:'Dormir cedo' },
  { id:'anotar',    label:'Anotar o dia' },
  { id:'gratidao',  label:'Momento de gratidÃ£o' },
  { id:'guardar',   label:'Guardar dinheiro' },
  { id:'organizar', label:'Organizar o espaÃ§o' }
];
const HABITS_MIN = 3;
const HABITS_MAX = 5;
let habits = null;

function dayKey(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayKey(){ return dayKey(new Date()); }
function dayDiff(a, b){
  const utc = s=>{ const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
  return Math.round((utc(b) - utc(a)) / 86400000);
}
function habitSetKey(){
  return habits.selected.slice().sort().join('|');
}
function loadHabits(){
  const saved = store.get('habits_v1', null);
  if(saved && Array.isArray(saved.selected) && saved.days){
    saved.selected = saved.selected.filter(id => HABIT_PRESETS.some(h=>h.id === id));
    return saved;
  }
  return { selected:['treinar','ler','agua'], days:{} };
}
function saveHabits(){ store.set('habits_v1', habits); }
function isDayComplete(key){
  const rec = habits.days[key];
  if(!rec || rec.set !== habitSetKey()) return false;
  const done = rec.done || [];
  return habits.selected.length > 0 && habits.selected.every(id=>done.indexOf(id) > -1);
}
function doneToday(){
  const key = todayKey();
  const rec = habits.days[key];
  if(!rec || rec.set !== habitSetKey()) return [];
  return (rec.done || []).filter(id=>habits.selected.indexOf(id) > -1);
}
function pruneHabitDays(){
  const keys = Object.keys(habits.days).sort();
  while(keys.length > 200) delete habits.days[keys.shift()];
}
function computeStreak(){
  let streak = 0;
  const cursor = new Date();
  if(!isDayComplete(dayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  while(isDayComplete(dayKey(cursor))){
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}
function computeBestStreak(){
  const keys = Object.keys(habits.days).sort();
  let best = 0, run = 0, prev = null;
  keys.forEach(k=>{
    if(isDayComplete(k)){
      run = (prev !== null && dayDiff(prev, k) === 1) ? run + 1 : 1;
      if(run > best) best = run;
    }else{
      run = 0;
    }
    prev = k;
  });
  return best;
}
function toggleHabit(id){
  const key = todayKey();
  const done = doneToday();

const NOTIF_KEY = 'notify_v1';
const NOTIF_CHANNEL = 'impulso-diario';
const NOTIF_BASE_ID = 9000;
const NOTIF_DAYS = 7;

function loadNotifCfg(){
  const cfg = store.get(NOTIF_KEY, null);
  if(cfg && typeof cfg.enabled === 'boolean' && typeof cfg.hour === 'number') return cfg;
  return { enabled:true, hour:8, minute:0 };
}
function saveNotifCfg(cfg){ store.set(NOTIF_KEY, cfg); }
function notifPlugin(){ return nativePlugin('LocalNotifications'); }

function dailyQuote(){
  const theme = usageTop('frases') || currentTheme || 'foco';
  const quotes = (THEMES[theme] && THEMES[theme].quotes) || [];
  const text = quotes.length ? quotes[Math.floor(Math.random() * quotes.length)] : 'O esforÃ§o de hoje Ã© a forÃ§a de amanhÃ£.';
  return { theme: theme, text: text };
}
function notifHourLabel(cfg){
  return String(cfg.hour).padStart(2, '0') + ':' + String(cfg.minute).padStart(2, '0');
}

async function notifStatus(){
  const LN = notifPlugin();
  if(!LN || !LN.checkPermissions) return { supported:false, granted:false };
  try{
    const res = await LN.checkPermissions();
    return { supported:true, granted: res && res.display === 'granted' };
  }catch(e){
    return { supported:true, granted:false };
  }
}

async function cancelScheduled(){
  const LN = notifPlugin();
  if(!LN || !LN.getPending) return;
  try{
    const pending = await LN.getPending();
    const mine = ((pending && pending.notifications) || []).filter(n => n.id >= NOTIF_BASE_ID && n.id < NOTIF_BASE_ID + 1000);
    if(mine.length) await LN.cancel({ notifications: mine.map(n=>({ id: n.id })) });
  }catch(e){ console.error('[notify] getPending falhou', e); }
}

async function ensureNotifChannel(){
  const LN = notifPlugin();
  if(!LN || !LN.createChannel) return;
  try{
    await LN.createChannel({
      id: NOTIF_CHANNEL,
      name:'Frase diÃ¡ria',
      description:'Uma frase motivacional por dia',
      importance:5,
      visibility:1,
      lights:true,
      lightColor:'#FFD8A14A'
    });
  }catch(e){ console.error('[notify] createChannel falhou', e); }
}

let notifSyncLock = null;
function syncNotifications(){
  // initApp e visibilitychange podem disparar juntos; serializa para
  // que um cancel nao apague o schedule do outro
  if(notifSyncLock) return notifSyncLock;
  notifSyncLock = doSyncNotifications().finally(()=>{ notifSyncLock = null; });
  return notifSyncLock;
}

async function doSyncNotifications(){
  const LN = notifPlugin();
  if(!LN || !LN.schedule) return;
  await cancelScheduled();
  const cfg = loadNotifCfg();
  if(!cfg.enabled) return;
  const status = await notifStatus();
  if(!status.granted) return;
  await ensureNotifChannel();

  // frases distintas para a semana, do tema mais usado
  const seen = new Set();
  const week = [];
  for(let i = 0; i < NOTIF_DAYS; i++){
    let quote = dailyQuote(), tries = 0;
    while(seen.has(quote.text) && tries++ < 10) quote = dailyQuote();
    seen.add(quote.text);
    week.push(quote);
  }

  const now = new Date();
  for(let i = 0; i < NOTIF_DAYS; i++){
    const when = new Date(now.getFullYear(), now.getMonth(), now.getDate(), cfg.hour, cfg.minute, 0, 0);
    if(when.getTime() <= now.getTime()) when.setDate(when.getDate() + 1 + i);
    else when.setDate(when.getDate() + i);
    const quote = week[i];
    try{
      await LN.schedule({
        notifications:[{
          id: NOTIF_BASE_ID + i,
          channelId: NOTIF_CHANNEL,
          title:'Impulso',
          body: quote.text,
          schedule:{ at: when, allowWhileIdle:true },
          extra:{ theme: quote.theme }
        }]
      });
    }catch(e){ console.error('[notify] schedule falhou', e); }
  }
}

async function requestNotifPermission(){
  const LN = notifPlugin();
  if(!LN || !LN.requestPermissions){
    toast('Atualize o app para habilitar a notificaÃ§Ã£o diÃ¡ria.');
    return false;
  }
  try{
    const res = await LN.requestPermissions();
    if(res && res.display === 'granted'){
      await syncNotifications();
      refreshAjustes();
      toast('NotificaÃ§Ã£o diÃ¡ria ativada.');
      return true;
    }
  }catch(e){ console.error('[notify] requestPermissions falhou', e); }
  toast('PermissÃ£o de notificaÃ§Ã£o negada.');
  refreshAjustes();
  return false;
}

async function testNotification(){
  const quote = dailyQuote();

  if(LN && LN.schedule){
    const status = await notifStatus();
    if(!status.granted){ toast('Permita as notificaÃ§Ãµes primeiro.'); return; }
    await ensureNotifChannel();
    try{
      await LN.schedule({
        notifications:[{
          id: NOTIF_BASE_ID + 99,
          channelId: NOTIF_CHANNEL,
          title:'Impulso',
          body: quote.text,

      });

    }catch(e){
      console.error('[notify] teste falhou', e);
      toast('NÃ£o foi possÃ­vel agendar o teste.');
    }
    return;
  }
  if('Notification' in window){
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('PermissÃ£o negada.'); return; }
    const send = ()=>toast('NotificaÃ§Ã£o de teste enviada.');
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(reg=>reg.showNotification('Impulso', { body: quote.text, icon:'icon-192.png' }))
        .then(send)
        .catch(()=>{ new Notification('Impulso', { body: quote.text }); send(); });
    }else{
      new Notification('Impulso', { body: quote.text });
      send();
    }
    return;
  }
  toast('NotificaÃ§Ãµes nÃ£o suportadas aqui.');
}

  $('pSpeed').onclick = ()=>{

  audio.addEventListener('timeupdate', ()=>{
    paintSeek();

      playerState.lastSave = Date.now();
      saveAudioPos();
    }
  });
  audio.addEventListener('play', ()=>setPlayIcon(true));
  audio.addEventListener('pause', ()=>setPlayIcon(false));
  audio.addEventListener('ended', ()=>{
    setPlayIcon(false);
    $('pSeek').value = 0;
    if(playerState.book) store.set('audio_pos_' + playerState.book.id, 0);

  audio.addEventListener('error', ()=>{

  document.addEventListener('keydown', (e)=>{
    if(e.key !== 'Escape') return;
    if(!$('reader').hidden) closeReader();

  });

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) return;

    syncNotifications().catch(()=>{});

}

const UPDATE_SOURCE = 'https://gabrielserpa242.github.io/impulso/versao.json';

function compareVersions(a, b){
  const pa = String(a).split('.').map(n=>parseInt(n,10)||0);
  const pb = String(b).split('.').map(n=>parseInt(n,10)||0);
  const len = Math.max(pa.length, pb.length);
  for(let i=0;i<len;i++){
    const xa = pa[i]||0, xb = pb[i]||0;
    if(xa>xb) return 1;
    if(xa<xb) return -1;
  }
  return 0;
}

function showUpdateBanner(info){
  const banner = document.getElementById('updateBanner');
  document.getElementById('updateBtn').onclick = ()=>{
    if(!info.apkUrl) return;
    console.log('[update] Baixar clicado:', info.apkUrl);
    const AppLauncher = nativePlugin('AppLauncher');
    if(AppLauncher && AppLauncher.openUrl){
      AppLauncher.openUrl({ url: info.apkUrl }).then(r=>{
        console.log('[update] openUrl:', r);
      }).catch(e=>{
        console.error('[update] AppLauncher.openUrl falhou:', e);
        window.open(info.apkUrl, '_system');
      });
      return;
    }
    const Browser = nativePlugin('Browser');
    if(Browser && Browser.open){
      Browser.open({ url: info.apkUrl }).catch(e=>{
        console.error('[update] Browser.open falhou:', e);
        window.open(info.apkUrl, '_system');
      });
      return;
    }
    const win = window.open(info.apkUrl, '_system');
    if(!win) window.location.href = info.apkUrl;
  };
  document.getElementById('updateClose').onclick = ()=>{
    banner.classList.remove('show');
    localStorage.setItem('impulso_update_dismiss', info.apkVersion);
  };
  banner.classList.add('show');
}

async function checkForUpdate(){
  const Device = nativePlugin('Device');
  console.log('[update] Device plugin:', Device);
  if(!Device) return;
  let installed = null;
  try{
    installed = (await Device.getInfo()).appVersion;
  }catch(e){ console.error('[update] Device.getInfo falhou:', e); return; }

  let info;
  try{
    info = await (await fetch(UPDATE_SOURCE + '?v=' + Date.now())).json();
    console.log('[update] versao.json:', info);
  }catch(e){ console.error('[update] fetch versao.json falhou:', e); return; }
  if(!info || !info.apkVersion) return;

  if(installed === info.apkVersion) return;
  if(localStorage.getItem('impulso_update_dismiss') === info.apkVersion) return;
  if(compareVersions(info.apkVersion, installed) > 0) showUpdateBanner(info);
}
